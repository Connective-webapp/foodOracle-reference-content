# Taxonomie des cuisines : continents, pays, régions.
# Trois niveaux via `parent` : continent (racine), pays ou territoire, puis régions
# rattachées à un pays (régions françaises sous `france`, `quebec` sous `canada`).
# Source des pays : liste des États membres de l'ONU (193), un.org/fr/about-us/member-states.
# Page non joignable depuis l'environnement de rédaction le 26/10/2026 (403) : liste établie
# de mémoire et vérifiée par le test (193 pays), à recouper avec la page.
# Classés par continent selon le géoschéma M49 de l'ONU
# (Chypre, Turquie, Géorgie, Arménie et Azerbaïdjan en Asie ; Russie en Europe ;
# Amérique centrale et Caraïbes sous `amerique-du-nord`, pas de continent supplémentaire).
# Territoires ajoutés pour leur cuisine distincte et documentée : Taïwan, Palestine, Hong Kong,
# Macao, Kosovo, Porto Rico, Groenland, Martinique, Guadeloupe, Guyane, Réunion,
# Polynésie française, Nouvelle-Calédonie.
